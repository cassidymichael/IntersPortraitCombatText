name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The release notes (GitHub release body and CurseForge changelog) are one CHANGELOG.md
      # section only. A release tag (v1.2.0) takes its own "## 1.2.0 (date)" section. A beta tag
      # (v1.2.0-beta.1) takes "## Unreleased", the changes since the last release, under a line
      # saying it's a test build. Any other tag stops the run here, before anything is uploaded.
      - name: Release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            awk -v v="$version" '/^## /{f = ($2 == v)} f' CHANGELOG.md > RELEASE_NOTES.md
            [ -s RELEASE_NOTES.md ] || { echo "CHANGELOG.md has no '## $version' section" >&2; exit 1; }
          elif [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]; then
            # The section without its heading or the blank lines after it.
            unreleased=$(awk '/^## /{f = ($2 == "Unreleased")} f' CHANGELOG.md | sed '1d' | sed '/./,$!d')
            grep -q '^- ' <<< "$unreleased" \
              || { echo "CHANGELOG.md has no '## Unreleased' section with entries" >&2; exit 1; }
            printf '## %s (test build)\n\n%s\n\n%s\n' "$version" \
              "A test build of the next version. To go back, switch the addon to release (stable) versions in your addon app." \
              "$unreleased" > RELEASE_NOTES.md
          else
            echo "Not a release (vX.Y.Z) or beta (vX.Y.Z-beta.N) tag: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          printf '\nEarlier versions: [CHANGELOG.md](https://github.com/%s/blob/%s/CHANGELOG.md)\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" >> RELEASE_NOTES.md
      - name: Package and release
        uses: BigWigsMods/packager@v2
        env:
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
          # CurseForge project 1725945 (## X-Curse-Project-ID in the TOC). Its own "Automatic
          # Packaging" stays off: it also fires on new tags, which would put two files on
          # every release.
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
